# Melinda node tests and webhook

name: Melinda node tests and webhook

on: push

jobs:
  build-node-versions:
    name: Node version matrix
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x, 26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - name: Checkout the code
      uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
      env:
        NPM_CONFIG_IGNORE_SCRIPTS: true
    - run: npm audit --package-lock-only --production --audit-level=high
    - run: npm ci
    - run: npm test
    - run: npm run build --if-present

  license-scan:
    name: License compliance check
    runs-on: ubuntu-latest
    container: node:24

    steps:
      - uses: actions/checkout@v7
      - uses: mikaelvesavuori/license-compliance-action@v1.0.3
        with:
          # default action list + BlueOak-1.0.0 (sax, via xml2js) + MIT-0 (nodemailer) — both OSI-approved permissive
          allow_licenses: 'MIT;ISC;0BSD;BSD-2-Clause;BSD-3-Clause;Apache-2.0;BlueOak-1.0.0;MIT-0'
          # pause@0.0.1 (pinned by passport) has no license field or LICENSE file; upstream pause 0.1.0 (same API) is MIT
          exclude_pattern: /^@natlibfi/;pause

  njsscan:
    name: Njsscan check
    runs-on: ubuntu-latest
    container: node:24

    steps:
    - name: Checkout the code
      uses: actions/checkout@v7
    - name: nodejsscan scan
      id: njsscan
      uses: ajinabraham/njsscan-action@master
      with:
        args: '.'

